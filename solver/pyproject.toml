[project]
name = "dispatch-solver"
version = "2.0.0"
description = "Exact and human-deduction solvers and grid generator for Dispatch puzzles (grid format of GAME-DESIGN.md §14)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ortools>=9.10"]

[project.scripts]
dispatch-solver = "dispatch_solver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch_solver"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
