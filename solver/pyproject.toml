[project]
name = "spot-solver"
version = "0.1.0"
description = "CP-SAT solver, uniqueness checker and grid generator for Dispatch puzzles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ortools>=9.10"]

[project.scripts]
spot-solver = "spot_solver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spot_solver"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
